name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  envsync-scan:
    name: envsync scan (working tree, same rules as local push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Optional server-side denylist: the ENVSYNC_DENYLIST repo secret holds
      # the same pattern lines a machine keeps in ~/.config/envsync/denylist
      # (client names, internal hostnames). Kept as a secret so the patterns
      # themselves never appear in the repo; empty/unset skips cleanly.
      - name: Install denylist from repo secret
        env:
          ENVSYNC_DENYLIST: ${{ secrets.ENVSYNC_DENYLIST }}
        run: |
          if [ -n "$ENVSYNC_DENYLIST" ]; then
            mkdir -p "$HOME/.config/envsync"
            printf '%s\n' "$ENVSYNC_DENYLIST" > "$HOME/.config/envsync/denylist"
            echo "denylist installed ($(grep -c . "$HOME/.config/envsync/denylist") line(s))"
          else
            echo "no ENVSYNC_DENYLIST secret set — denylist scan will be a no-op"
          fi
      - name: Run envsync scan
        run: bash envsync scan

  gitleaks:
    name: gitleaks (full commit history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so secrets committed then removed within a PR
          # are still caught.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    name: script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n all scripts
        run: |
          set -e
          for f in envsync shared/sync.sh macos/sync.sh bazzite/sync.sh \
                   install-env.sh install-agents.sh shared/git/install-aliases.sh; do
            bash -n "$f" && echo "syntax ok: $f"
          done
      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -qy shellcheck
          # sync.sh files are sourced by envsync, so helpers/vars are
          # defined externally (SC2034 unused, SC2154 unassigned).
          shellcheck -s bash -e SC2034,SC2154 \
            envsync shared/sync.sh macos/sync.sh bazzite/sync.sh
